<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Evaluation AI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
  min-height:100vh;
  display:flex;
}

/* LEFT – WHITE SIDE */
.left{
  width:55%;
  background:#ffffff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:60px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

/* RIGHT – MAROON SIDE */
.right{
  width:45%;
  background:linear-gradient(135deg,#5a0f1b,#7a1f2d);
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  padding:30px;
}

/* LOGO */
.logo{
  width:320px;
  margin-bottom:25px;
  animation:floatPulse 5s ease-in-out infinite;
  max-width:100%;
}

/* HEADING */
.title{
  font-size:2.8rem;
  font-weight:800;
  color:#5a0f1b;
  margin-bottom:12px;
  animation:fadeUp 1.2s ease forwards;
}

/* SUBLINE */
.subtitle{
  font-size:1.15rem;
  line-height:1.5;
  color:#555;
  max-width:480px;
  animation:fadeUp 1.6s ease forwards;
}

/* LOGIN BOX */
.login-box{
  background:#ffffff;
  padding:40px 35px;
  border-radius:18px;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  text-align:center;
  width:100%;
  max-width:380px;
  animation:zoomIn 0.9s ease;
}

/* LOGIN TITLE */
.login-title{
  font-size:1.6rem;
  font-weight:700;
  color:#5a0f1b;
  margin-bottom:25px;
}

/* BUTTONS */
.btn{
  width:100%;
  padding:14px;
  margin:12px 0;
  border-radius:14px;
  font-size:1.05rem;
  font-weight:600;
  text-decoration:none;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  background:#5a0f1b;
  color:#fff;
  transition:0.3s ease;
}

.btn:hover{
  background:#7a1f2d;
  transform:translateY(-3px);
}

/* FLOATING ICONS */
.edu-left{
  position:absolute;
  color:rgba(90,15,27,0.12);
  font-size:4rem;
  animation:floatIcons 9s ease-in-out infinite;
}

.l1{ top:12%; left:10%; }
.l2{ bottom:18%; right:12%; }
.l3{ top:40%; right:22%; }

.edu-right{
  position:absolute;
  color:rgba(255,255,255,0.15);
  font-size:3.5rem;
  animation:floatIcons 8s linear infinite;
}

.r1{ top:10%; left:15%; }
.r2{ top:45%; right:10%; }
.r3{ bottom:15%; left:25%; }

/* ANIMATIONS */
@keyframes fadeUp{
  from{ opacity:0; transform:translateY(30px); }
  to{ opacity:1; transform:translateY(0); }
}

@keyframes zoomIn{
  from{ opacity:0; transform:scale(0.9); }
  to{ opacity:1; transform:scale(1); }
}

@keyframes floatPulse{
  0%,100%{ transform:translateY(0) scale(1); }
  50%{ transform:translateY(-12px) scale(1.03); }
}

@keyframes floatIcons{
  0%{ transform:translateY(0); }
  50%{ transform:translateY(-30px); }
  100%{ transform:translateY(0); }
}

/* ================= RESPONSIVE ================= */

/* TABLET */
@media(max-width:1024px){
  .title{ font-size:2.4rem; }
  .logo{ width:260px; }
}

/* MOBILE */
@media(max-width:900px){
  body{
    flex-direction:column;
  }

  .left, .right{
    width:100%;
    padding:40px 20px;
  }

  .logo{
    width:220px;
  }

  .title{
    font-size:2rem;
  }

  .subtitle{
    font-size:1rem;
  }

  .edu-left, .edu-right{
    display:none;
  }
}

/* SMALL MOBILE */
@media(max-width:480px){
  .login-box{
    padding:30px 25px;
  }

  .login-title{
    font-size:1.4rem;
  }

  .btn{
    font-size:1rem;
    padding:12px;
  }
}
</style>
</head>

<body>

<!-- LEFT -->
<div class="left">
  <i class="fas fa-book edu-left l1"></i>
  <i class="fas fa-graduation-cap edu-left l2"></i>
  <i class="fas fa-pen edu-left l3"></i>

  <img src="frontpage.png" class="logo">

  <h1 class="title">SMART EVALUATION AI</h1>
  <p class="subtitle">
    A next-gen system for intelligent assessment and evaluation
  </p>
</div>

<!-- RIGHT -->
<div class="right">
  <i class="fas fa-graduation-cap edu-right r1"></i>
  <i class="fas fa-book edu-right r2"></i>
  <i class="fas fa-pen edu-right r3"></i>

  <div class="login-box">
    <div class="login-title">Login Portal</div>

    <a href="student portal.html" class="btn">
      <i class="fas fa-user-graduate"></i> Student Login
    </a>

    <a href="admin portal.html" class="btn">
      <i class="fas fa-chalkboard-teacher"></i> Teacher Login
    </a>
  </div>
</div>

</body>
</html>
