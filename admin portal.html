<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Login</title>
    <link rel="stylesheet" href="css.css">

    <style>
        /* ===== POPUP OVERLAY (UI ONLY) ===== */
        .modal{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.6);
            display:none;
            justify-content:center;
            align-items:center;
            z-index:1000;
        }

        .modal.show{
            display:flex;
        }

        .close-btn{
            position:absolute;
            top:15px;
            right:20px;
            font-size:22px;
            font-weight:bold;
            cursor:pointer;
            color:#5a0f1b;
        }
    </style>
</head>

<body>

<!-- ===== LEFT INFO ===== -->
<div class="left">
    <img src="frontpage.png" class="logo">
    <div class="title">Smart Evaluation System</div>
    <div class="subtitle">
        Student portal for online examinations, result viewing,
        and academic performance tracking.
    </div>
</div>

<!-- ===== RIGHT LOGIN ===== -->
<div class="right">
    <div class="register-box">
        <div class="register-title">Teacher Login</div>

        <input type="text" placeholder="Teacher ID">
        <input type="password" placeholder="Password">

        <a href="teach.html" class="login-btn">Login</a>



        <p class="signup-text" style="margin-top:15px; text-align:center;">
            Don’t have an account?
            <a href="#" onclick="openPopup()">Sign up</a>
        </p>
    </div>
</div>

<!-- ===== REGISTRATION POPUP ===== -->
<div class="modal" id="popup">
    <div class="register-box" style="width:520px; position:relative;">
        <span class="close-btn" onclick="closePopup()">×</span>

        <div class="register-title">Teacher Registration</div>

        <div class="form-grid">
            <input type="text" placeholder="Semester">
            <input type="text" placeholder="Full Name">

            <input type="text" placeholder="Username">
            <input type="text" placeholder="College Roll Number">

            <input type="password" placeholder="Password">
            <input type="text" placeholder="Department">

            <input type="password" placeholder="Confirm Password">
            <input type="tel" placeholder="Mobile Number">

            <input type="email" placeholder="Email ID">
            <input type="file" class="file-input">

            <button type="button" style="grid-column:1/3;">
                Register
            </button>
        </div>
    </div>
</div>

<!-- ===== JS (UI ONLY) ===== -->
<script>
function openPopup(){
    document.getElementById("popup").classList.add("show");
}

function closePopup(){
    document.getElementById("popup").classList.remove("show");
}
</script>

</body>
</html>
