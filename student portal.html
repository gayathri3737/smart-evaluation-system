<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Login</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css.css">

<style>

/* ===== POPUP ===== */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.close-btn{
    position:absolute;
    top:15px;
    right:20px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    color:#5a0f1b;
}

/* ================= FLOATING ICONS ================= */

.edu-icon{
    position:absolute;
    color:rgba(90,15,27,0.12);
    font-size:3.8rem;
    animation:floatIcons 10s ease-in-out infinite;
    pointer-events:none;
}

/* SCATTERED POSITIONS */

/* LEFT SIDE AREA */
.i1{ top:6%; left:5%; }
.i2{ top:35%; left:22%; }
.i3{ bottom:8%; left:73%; }
.i4{ top:70%; left:32%; }
.i5{ top:20%; left:28%; }

/* RIGHT SIDE AREA (avoid login box center) */
.i6{ top:5%; right:6%; }
.i7{ top:30%; right:4%; }
.i8{ bottom:6%; right:8%; }
.i9{ bottom:30%; right:18%; }
.i10{ top:60%; right:22%; }

/* FLOAT ANIMATION */
@keyframes floatIcons{
    0%{ transform:translateY(0); }
    50%{ transform:translateY(-35px); }
    100%{ transform:translateY(0); }
}

</style>
</head>

<body>

<!-- ================= FLOATING ICONS ================= -->





<!-- ================= LEFT INFO ================= -->
 
<div class="left">
    <i class="fas fa-book edu-icon i1"></i>
<i class="fas fa-graduation-cap edu-icon i2"></i>
<i class="fas fa-pen edu-icon i3"></i>
<i class="fas fa-laptop-code edu-icon i4"></i>
<i class="fas fa-microscope edu-icon i5"></i>
<img src="frontpage.png" class="logo">
    <div class="title">Student Portal</div>
    <div class="subtitle">
        Student portal for online examinations, result viewing,
        and academic performance tracking.
    </div>
</div>


<!-- ================= RIGHT LOGIN ================= -->
<div class="right">
    <i class="fas fa-calculator edu-icon i6"></i>
<i class="fas fa-book-open edu-icon i7"></i>
<i class="fas fa-user-graduate edu-icon i8"></i>
<i class="fas fa-flask edu-icon i9"></i>
<i class="fas fa-chalkboard edu-icon i10"></i>
    <div class="register-box">
        <div class="register-title">Student Login</div>

        <input type="text" placeholder="Student ID">
        <input type="password" placeholder="Password">

        <a href=".vscode/student.html" class="login-btn">Login</a>

        <p class="signup-text" style="margin-top:15px; text-align:center;">
            Don’t have an account?
            <a href="#" onclick="openPopup()">Sign up</a>
        </p>
    </div>
</div>


<!-- ================= REGISTRATION POPUP ================= -->
<div class="modal" id="popup">
    <div class="register-box" style="width:520px; position:relative;">
        <span class="close-btn" onclick="closePopup()">×</span>

        <div class="register-title">Student Registration</div>

        <div class="form-grid">
            <input type="text" placeholder="Semester">
            <input type="text" placeholder="Full Name">

            <input type="text" placeholder="Username">
            <input type="text" placeholder="College Roll Number">

            <input type="password" placeholder="Password">
            <input type="text" placeholder="Department">

            <input type="password" placeholder="Confirm Password">
            <input type="tel" placeholder="Mobile Number">

            <input type="email" placeholder="Email ID">
            <input type="file" class="file-input">

            <button type="button" style="grid-column:1/3;">
                Register
            </button>
        </div>
    </div>
</div>


<!-- ================= JS ================= -->
<script>
function openPopup(){
    document.getElementById("popup").classList.add("show");
}

function closePopup(){
    document.getElementById("popup").classList.remove("show");
}
</script>

</body>
</html>
